<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #202124; --muted: #5f6368; --line: #dadce0; --hover: #f1f3f4; --accent: #5b4bdb; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #292a2d; --fg: #e8eaed; --muted: #9aa0a6; --line: #3c4043; --hover: #35363a; --accent: #a59bff; --on-accent: #1b1530; } }
  body { margin: 0; width: 340px; height: 480px; display: flex; flex-direction: column; overflow: hidden; font: 13px system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  header img { width: 20px; height: 20px; }
  h1 { font-size: 14px; margin: 0; flex: 1; }
  #count { color: var(--muted); font-size: 12px; min-width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
  button { font: inherit; cursor: pointer; border-radius: 6px; padding: 6px 12px; border: 1px solid var(--line); background: transparent; color: var(--fg); }
  .bar button { padding: 6px 10px; }
  button:hover:not(:disabled) { background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  #refresh { margin-left: auto; }
  .bar button.stop { border-color: #d93025; color: #d93025; min-width: 64px; }
  @media (prefers-color-scheme: dark) { .bar button.stop { border-color: #f28b82; color: #f28b82; } }
  button:disabled { opacity: .5; cursor: default; }
  #gear { padding: 2px 7px; font-size: 16px; line-height: 1.2; }
  #gear[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
  .content { position: relative; flex: 1; min-height: 0; }
  ul { list-style: none; margin: 0; padding: 4px 0; height: 100%; box-sizing: border-box; overflow-y: auto; scrollbar-gutter: stable; }
  li label { display: flex; align-items: center; gap: 8px; padding: 5px 12px; cursor: pointer; }
  li label:hover { background: var(--hover); }
  li.off label { cursor: default; opacity: .45; }
  li img { width: 16px; height: 16px; flex: none; }
  li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.active span { font-weight: 600; }
  .bar { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); }
  form { position: absolute; inset: 0; z-index: 1; overflow-y: auto; background: var(--bg); display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; align-content: start; padding: 12px; }
  form[hidden] { display: none; }
  form label { color: var(--muted); }
  select, input[type=number], input[type=text] { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); min-width: 0; }
  input:disabled { opacity: .5; }
  .row { display: contents; }
  .row[hidden] { display: none; }
  .dir { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .dir span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dir button { padding: 3px 10px; }
  .check { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; color: var(--fg) !important; }
  .hint { grid-column: 1 / -1; color: var(--muted); font-size: 11px; margin-top: -4px; }
</style>
</head>
<body>
<header>
  <img src="icons/32.png" alt="">
  <h1>TabPrint</h1>
  <span id="count"></span>
  <button id="gear" title="Print settings" aria-label="Print settings" aria-expanded="false" aria-controls="settings">⚙</button>
</header>
<div class="content">
<form id="settings" hidden>
  <label for="paper">Paper size</label>
  <select id="paper">
    <option>Letter</option><option>Legal</option><option>Tabloid</option>
    <option>A3</option><option>A4</option><option>A5</option>
  </select>
  <label for="landscape">Layout</label>
  <select id="landscape"><option value="false">Portrait</option><option value="true">Landscape</option></select>
  <label for="margins">Margins</label>
  <select id="margins"><option value="default">Default</option><option value="minimum">Minimum</option><option value="none">None</option></select>
  <label for="scale">Scale (%)</label>
  <input id="scale" type="number" min="10" max="200" step="5">
  <label for="pages">Pages</label>
  <input id="pages" type="text" placeholder="All, e.g. 1-5, 8">
  <span class="hint">Tabs with fewer pages than the range will fail.</span>
  <label for="saveMode">Save to</label>
  <select id="saveMode">
    <option value="downloads">Downloads folder</option>
    <option value="custom">Choose folder…</option>
    <option value="ask">Ask every time</option>
  </select>
  <div class="row" id="rowSub">
    <label for="folder">Subfolder</label>
    <input id="folder" type="text" placeholder="Downloads root">
  </div>
  <div class="row" id="rowDir">
    <label>Folder</label>
    <div class="dir"><span id="dirName"></span><button type="button" id="chooseDir">Choose…</button></div>
  </div>
  <span class="hint" id="saveHint"></span>
  <label class="check"><input id="background" type="checkbox"> Background graphics</label>
  <label class="check"><input id="headerFooter" type="checkbox"> Headers and footers</label>
</form>
<ul id="tabs"></ul>
</div>
<div class="bar">
  <button id="all">All</button>
  <button id="none">None</button>
  <button id="refresh" class="action" title="Reload the selected tabs">Refresh</button>
  <button id="load" class="action" title="Scroll each selected tab to the bottom so lazy content and images load">Load</button>
  <button id="print" class="primary">Print</button>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
